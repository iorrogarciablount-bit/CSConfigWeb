<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miras de CS2 de pros y jugadores · CSConfig</title>
<meta name="description" content="Miras de CS2 de jugadores profesionales y de cualquier jugador, sacadas de demos de partidas reales. Busca por nick, usuario de FACEIT o SteamID y copia el código.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./"><h1>CS<span>Config</span></h1></a>
  <nav class="topnav">
    <a href="./" aria-current="page" data-i="navPros">Miras</a>
    <a href="conversor/" data-i="navConv">Conversor</a>
    <a href="https://github.com/iorrogarciablount-bit/CSConfigWeb/issues/new?template=enviar-demo.yml" target="_blank" rel="noopener" data-i="navSubmit">Enviar demo</a>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="lang_es" aria-pressed="true">ES</button><button id="lang_en" aria-pressed="false">EN</button>
    </div>
  </nav>
</header>

<main>
  <div>
    <h2 class="ptitle" data-i="title">Miras de <span>CS2</span></h2>
    <p class="lead" data-i="lead"></p>
  </div>

  <div class="stats">
    <div class="stat"><b id="stPros">–</b><span data-i="stPros">Pros</span></div>
    <div class="stat"><b id="stPlayers">–</b><span data-i="stPlayers">Jugadores</span></div>
    <div class="stat"><b id="stUpdated">–</b><span data-i="stUpdated">Actualizado</span></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab_pros" aria-controls="panel_pros" aria-selected="true"><span data-i="tabPros">Pros</span> <small id="nPros"></small></button>
    <button role="tab" id="tab_players" aria-controls="panel_players" aria-selected="false"><span data-i="tabPlayers">Jugadores</span> <small id="nPlayers"></small></button>
  </div>

  <div id="panel_pros" role="tabpanel" aria-labelledby="tab_pros" class="panel">
    <section class="card">
      <p class="step"><span data-i="findPros">Buscar pros</span></p>
      <div class="filters">
        <input type="search" id="q" autocomplete="off" spellcheck="false">
        <select id="team" aria-label="Equipo"></select>
        <select id="sort" aria-label="Orden"></select>
      </div>
      <div class="toolbar">
        <div class="chips bgChips"></div>
        <span class="count" id="count"></span>
      </div>
    </section>
    <section class="plist" id="list" aria-live="polite"></section>
  </div>

  <div id="panel_players" role="tabpanel" aria-labelledby="tab_players" class="panel" hidden>
    <section class="card">
      <p class="step"><span data-i="findPlayers">Buscar jugador</span></p>
      <input type="search" id="pq" class="bigsearch" autocomplete="off" spellcheck="false">
      <p class="fine" id="pHint" data-i="pHint"></p>
      <div class="toolbar">
        <div class="chips bgChips"></div>
        <span class="count" id="pcount"></span>
      </div>
    </section>
    <p class="sublabel" id="pLabel"></p>
    <section class="plist" id="plist" aria-live="polite"></section>
  </div>

  <details>
    <summary data-i="aboutTitle">Cómo funciona</summary>
    <div class="faq" id="about" style="margin-top:14px"></div>
  </details>

  <footer><span data-i="footer"></span> <a id="removeLink" target="_blank" rel="noopener" href="https://github.com/iorrogarciablount-bit/CSConfigWeb/issues/new?template=retirar-jugador.yml" data-i="remove">Pedir que retiremos un jugador</a></footer>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sName">
  <div class="shead">
    <h2 id="sName"></h2>
    <button class="xbtn" id="sClose" aria-label="Cerrar">✕</button>
  </div>
  <div class="sbody">
    <div class="codebox">
      <p class="code" id="sCode"></p>
      <button class="copy" id="sCopy" data-i="copy">Copiar</button>
    </div>
    <div class="sgrid">
      <canvas id="sCv" width="300" height="300" aria-label="Vista previa de la mira"></canvas>
      <table class="vtable"><tbody id="sVals"></tbody></table>
    </div>
    <div class="links" id="sLinks"></div>
    <div>
      <p class="step" style="margin:0 0 10px;background:none;border:0;padding:0" data-i="history">Historial</p>
      <ul class="hist" id="sHist"></ul>
    </div>
    <p class="src" id="sSrc"></p>
  </div>
</dialog>

<script src="assets/crosshair.js"></script>
<script>
(() => {
const SUBMIT = 'https://github.com/iorrogarciablount-bit/CSConfigWeb/issues/new?template=enviar-demo.yml';
const T = {
es: {
  navPros:'Miras', navConv:'Conversor', navSubmit:'Enviar demo', title:'Miras de <span>CS2</span>',
  lead:'Las miras que usan los profesionales y cualquier jugador, sacadas directamente de las demos de sus partidas. Pulsa un jugador para ver los detalles y copiar su código.',
  stPros:'Pros', stPlayers:'Jugadores', stUpdated:'Actualizado', tabPros:'Pros', tabPlayers:'Jugadores',
  findPros:'Buscar pros', findPlayers:'Buscar jugador',
  q:'Jugador o equipo…', allTeams:'Todos los equipos', sort:['Recientes','Nombre','Equipo'],
  pq:'Nick, usuario de FACEIT, SteamID64 o enlace de Steam…',
  pHint:'Aparecen todos los jugadores de las demos procesadas. Si no encuentras a alguien, envía una demo de una partida suya.',
  vanity:'Los enlaces de Steam con nombre personalizado (/id/…) no se pueden buscar. Usa el nick, el usuario de FACEIT o el SteamID64 (lo ves en steamid.io).',
  recent:'Vistos recientemente', results:'Resultados', none:'Ningún jugador coincide con la búsqueda.',
  count:(n, t) => `${n} de ${t} jugadores`, pcount:(n, t) => `${n} de ${t} jugadores`,
  copy:'Copiar', copied:'¡Copiado!', selected:'Ctrl+C',
  history:'Historial de miras', current:'actual', use:'Usar', changed:'Cambió hace poco',
  seenOn:(m, d) => `Visto en ${m} · ${d}`, source:(s, d) => `Visto por última vez el ${d} · ${s}`,
  aka:'También jugó como', steam:'Perfil de Steam', faceitProfile:'Perfil de FACEIT', faceitRoom:'Partida en FACEIT',
  vals:{style:'Estilo', length:'Largo', gap:'Separación', thickness:'Grosor', color:'Color', a:'Opacidad', dot:'Punto', t:'Estilo T', outline:'Contorno', recoil:'Sigue el retroceso', h:'Resolución del código'},
  yes:'Sí', no:'No', outlineOpts:['No','Completo','Medio'],
  emptyTitle:'La base de datos se está llenando', emptyText:`Las miras aparecen aquí en cuanto se procesan demos. ¿Tienes la demo de una partida? <a href="${SUBMIT}" target="_blank" rel="noopener">Envíala</a> y sus miras se añadirán solas.`,
  loadErr:'No se han podido cargar los datos. Recarga la página.',
  aboutTitle:'Cómo funciona',
  about:[['¿De dónde salen las miras?','Cada demo de CS2 guarda el código de mira de todos los jugadores. Analizamos demos de partidas y guardamos la mira que cada jugador tenía al final.'],
         ['¿Qué diferencia hay entre Pros y Jugadores?','En Pros están los profesionales que tenemos identificados, con su nombre y equipo. En Jugadores está todo el que haya aparecido en alguna demo, para que puedas buscar la mira de cualquiera.'],
         ['¿Cómo la pongo en el juego?','Copia el código y en CS2 ve a Ajustes → Juego → Mira / Miras telescópicas → Compartir o importar → pega y pulsa Importar.'],
         ['¿Puedo aportar demos?','Sí. Pulsa «Enviar demo» y pega el enlace directo a la demo (necesitas una cuenta de GitHub). Se procesa sola y te contestamos con los jugadores añadidos.'],
         ['No quiero aparecer','Pulsa «Pedir que retiremos un jugador» al final de la página e indica tu SteamID64.'],
         ['Tengo un código antiguo (CSGO-…)','Usa la pestaña Conversor para pasarlo al formato nuevo.']],
  footer:'Proyecto independiente. No está afiliado ni respaldado por Valve, FACEIT ni los equipos o jugadores que aparecen.', remove:'Pedir que retiremos un jugador',
  styles:['Cruz dinámica','Círculo dinámico','Cruz dinámica (legacy)','Círculo estático','Cruz estática','Cruz estática con retroceso','Solo punto','Quad dinámico','Cuadrado estático','Quad estático'],
  locale:'es-ES',
},
en: {
  navPros:'Crosshairs', navConv:'Converter', navSubmit:'Submit a demo', title:'CS2 <span>crosshairs</span>',
  lead:'The crosshairs pros and any player actually use, pulled straight from their match demos. Tap a player to see the details and copy their code.',
  stPros:'Pros', stPlayers:'Players', stUpdated:'Updated', tabPros:'Pros', tabPlayers:'Players',
  findPros:'Search pros', findPlayers:'Find a player',
  q:'Player or team…', allTeams:'All teams', sort:['Recent','Name','Team'],
  pq:'Nickname, FACEIT username, SteamID64 or Steam link…',
  pHint:'Every player from the processed demos shows up here. Can\'t find someone? Submit a demo of one of their matches.',
  vanity:'Steam links with a custom name (/id/…) can\'t be searched. Use the nickname, FACEIT username or SteamID64 (find it on steamid.io).',
  recent:'Recently seen', results:'Results', none:'No player matches your search.',
  count:(n, t) => `${n} of ${t} players`, pcount:(n, t) => `${n} of ${t} players`,
  copy:'Copy', copied:'Copied!', selected:'Ctrl+C',
  history:'Crosshair history', current:'current', use:'Use', changed:'Recently changed',
  seenOn:(m, d) => `Seen on ${m} · ${d}`, source:(s, d) => `Last seen ${d} · ${s}`,
  aka:'Also played as', steam:'Steam profile', faceitProfile:'FACEIT profile', faceitRoom:'FACEIT match',
  vals:{style:'Style', length:'Length', gap:'Gap', thickness:'Thickness', color:'Color', a:'Opacity', dot:'Dot', t:'T style', outline:'Outline', recoil:'Follow recoil', h:'Code resolution'},
  yes:'Yes', no:'No', outlineOpts:['No','Full','Half'],
  emptyTitle:'The database is filling up', emptyText:`Crosshairs show up here as soon as demos are processed. Have a match demo? <a href="${SUBMIT}" target="_blank" rel="noopener">Submit it</a> and its crosshairs are added automatically.`,
  loadErr:'The data could not be loaded. Reload the page.',
  aboutTitle:'How it works',
  about:[['Where do the crosshairs come from?','Every CS2 demo stores each player\'s crosshair code. We parse match demos and keep the crosshair each player had at the end.'],
         ['What\'s the difference between Pros and Players?','Pros are the professionals we have identified, with their name and team. Players includes everyone who has appeared in a demo, so you can look up anyone\'s crosshair.'],
         ['How do I use it in game?','Copy the code, then in CS2 go to Settings → Game → Crosshair / Scopes → Share or Import → paste and press Import.'],
         ['Can I contribute demos?','Yes. Press "Submit a demo" and paste a direct link to the demo (you need a GitHub account). It is processed automatically and we reply with the players added.'],
         ['I don\'t want to be listed','Press "Ask us to remove a player" at the bottom of the page and give your SteamID64.'],
         ['I have an old code (CSGO-…)','Use the Converter tab to turn it into the new format.']],
  footer:'Independent project. Not affiliated with or endorsed by Valve, FACEIT or the teams and players shown.', remove:'Ask us to remove a player',
  styles:['Dynamic cross','Dynamic circle','Dynamic cross (legacy)','Static circle','Static cross','Static cross with shot feedback','Dot only','Dynamic quad','Static square','Static quad'],
  locale:'en-GB',
}};
const MAPN = typeof MAPS !== 'undefined' ? MAPS : [];
const MAP_NAMES = { de_dust2:'Dust II', de_mirage:'Mirage', de_inferno:'Inferno', de_nuke:'Nuke', de_ancient:'Ancient', de_anubis:'Anubis', de_overpass:'Overpass', de_train:'Train', de_vertigo:'Vertigo', de_train_cs2:'Train' };
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang = store.get('lang') || ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en');
let bgIdx = clamp(+(store.get('bg') || 0) || 0, 0, 6);
const ds = { pros: { rows: [], loaded: false, failed: false, updated: null }, players: { rows: [], loaded: false, failed: false, updated: null } };
let tab = location.hash === '#jugadores' || location.hash === '#players' ? 'players' : 'pros', current = null;
const t = () => T[lang];

const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(t().locale, { day:'numeric', month:'short', year:'numeric' }); } catch { return iso || ''; } };
const mapName = m => MAP_NAMES[m] || (m || '').replace(/^de_/, '').replace(/^\w/, c => c.toUpperCase());
const daysAgo = iso => (Date.now() - new Date(iso).getTime()) / 864e5;
function decodeSafe(code) { try { return anyCode(code); } catch { return null; } }
const shownCode = (code, n) => /^CSGO-/.test(code) ? encodeNew(n) : code;

function drawThumb(cv, n) { const p = newParams(n); paint(cv, p, clamp(fitZoom(cv.width, p), 2, 4), bgIdx); }

function subline(r) {
  if (r.pro) return esc(r.team || '—');
  if (r.faceit) return `<span class="fc">FACEIT</span> ${esc(r.faceit)}`;
  return esc(r.map ? t().seenOn(mapName(r.map), fmtDate(r.seen)) : fmtDate(r.seen));
}

function card(r) {
  const n = r.n, L = t();
  const b = document.createElement('button');
  b.className = 'pcard'; b.type = 'button';
  b.innerHTML = `<canvas width="96" height="96" aria-hidden="true"></canvas>
    <span class="pbody"><span class="pname">${esc(r.name)}</span><span class="pteam">${subline(r)}</span>
    <span class="specs"><span>L <b>${n.length}</b></span><span>G <b>${n.gap}</b></span><span>T <b>${n.thickness}</b></span>
    <span><i class="swatch" style="background:rgb(${n.r},${n.g},${n.b})"></i></span>${n.dot ? '<span>•</span>' : ''}</span>
    ${r.changed ? `<span class="badge">${L.changed}</span>` : ''}</span>`;
  b.onclick = () => openSheet(r);
  drawThumb(b.querySelector('canvas'), n);
  return b;
}

function fill(box, rows) {
  box.innerHTML = '';
  const frag = document.createDocumentFragment();
  rows.forEach(r => frag.append(card(r)));
  box.append(frag);
}
const emptyBox = (box, html) => { box.innerHTML = `<div class="card empty" style="grid-column:1/-1">${html}</div>`; };

/* ---------- pestaña Pros ---------- */
function listPros() {
  const L = t(), box = $('list'), d = ds.pros;
  if (d.failed) return emptyBox(box, `<p>${L.loadErr}</p>`);
  if (!d.loaded) return;
  if (!d.rows.length) { $('count').textContent = ''; return emptyBox(box, `<h3>${L.emptyTitle}</h3><p>${L.emptyText}</p>`); }
  const q = $('q').value.trim().toLowerCase(), team = $('team').value, sort = +$('sort').value;
  const out = d.rows.filter(r => (!team || r.team === team) && (!q || r.name.toLowerCase().includes(q) || (r.team || '').toLowerCase().includes(q)));
  out.sort([(a, b) => (b.seen || '').localeCompare(a.seen || '') || a.name.localeCompare(b.name),
            (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity:'base' }),
            (a, b) => (a.team || '~').localeCompare(b.team || '~') || a.name.localeCompare(b.name)][sort]);
  $('count').textContent = L.count(out.length, d.rows.length);
  if (!out.length) return emptyBox(box, `<p>${L.none}</p>`);
  fill(box, out);
}

/* ---------- pestaña Jugadores ---------- */
function listPlayers() {
  const L = t(), box = $('plist'), d = ds.players;
  if (d.failed) return emptyBox(box, `<p>${L.loadErr}</p>`);
  if (!d.loaded) { if (tab === 'players') loadPlayers(); return; }
  const all = [...d.rows, ...ds.pros.rows];
  const raw = $('pq').value.trim();
  $('pHint').textContent = L.pHint; $('pHint').classList.remove('warn');
  if (!all.length) { $('pcount').textContent = ''; $('pLabel').textContent = ''; return emptyBox(box, `<h3>${L.emptyTitle}</h3><p>${L.emptyText}</p>`); }
  let out;
  if (!raw) {
    out = all.slice().sort((a, b) => (b.seen || '').localeCompare(a.seen || '')).slice(0, 24);
    $('pLabel').textContent = L.recent;
  } else {
    if (/steamcommunity\.com\/id\//i.test(raw)) { $('pHint').textContent = L.vanity; $('pHint').classList.add('warn'); }
    const idm = raw.match(/(7656\d{13})/);
    const q = raw.toLowerCase();
    out = idm ? all.filter(r => r.id === idm[1])
              : all.filter(r => [r.name, r.faceit, r.nick, ...(r.aliases || [])].some(x => x && x.toLowerCase().includes(q)));
    out.sort((a, b) => {
      const ea = [a.name, a.faceit].some(x => x && x.toLowerCase() === q), eb = [b.name, b.faceit].some(x => x && x.toLowerCase() === q);
      return (eb - ea) || (b.seen || '').localeCompare(a.seen || '');
    });
    out = out.slice(0, 60);
    $('pLabel').textContent = L.results;
  }
  $('pcount').textContent = L.pcount(out.length, all.length);
  if (!out.length) return emptyBox(box, `<p>${L.none}</p>`);
  fill(box, out);
}

/* ---------- ficha ---------- */
function valsTable(n) {
  const L = t(), V = L.vals;
  return [[V.style, L.styles[n.style] ?? n.style], [V.length, n.length], [V.gap, n.gap], [V.thickness, n.thickness],
    [V.color, `<i class="swatch" style="background:rgb(${n.r},${n.g},${n.b})"></i> ${n.r} ${n.g} ${n.b}`], [V.a, n.a],
    [V.dot, n.dot ? L.yes : L.no], [V.t, n.t ? L.yes : L.no], [V.outline, L.outlineOpts[n.outline] ?? n.outline],
    [V.recoil, n.recoil ? L.yes : L.no], [V.h, n.h ? `${n.h}p` : '—']].map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}
function showCode(code) {
  const n = decodeSafe(code); if (!n) return;
  $('sCode').textContent = shownCode(code, n); $('sVals').innerHTML = valsTable(n);
  const p = newParams(n); paint($('sCv'), p, fitZoom($('sCv').width, p), bgIdx);
}
function openSheet(r) {
  const L = t(); current = r;
  const sub = r.pro ? esc(r.team || '') : (r.faceit ? `FACEIT: ${esc(r.faceit)}` : '');
  $('sName').innerHTML = `${esc(r.name)}<small>${sub}</small>`;
  showCode(r.code);
  const links = [`<a href="https://steamcommunity.com/profiles/${esc(r.id)}" target="_blank" rel="noopener">${L.steam}</a>`];
  if (r.faceit) links.push(`<a href="https://www.faceit.com/${lang}/players/${encodeURIComponent(r.faceit)}" target="_blank" rel="noopener">${L.faceitProfile}</a>`);
  if (r.faceit_match) links.push(`<a href="https://www.faceit.com/${lang}/cs2/room/${encodeURIComponent(r.faceit_match)}" target="_blank" rel="noopener">${L.faceitRoom}</a>`);
  const aka = [...new Set([...(r.aliases || []), ...(r.pro && r.nick && r.nick !== r.name ? [r.nick] : [])])];
  $('sLinks').innerHTML = links.join('') + (aka.length ? `<span class="aka">${L.aka}: ${aka.map(esc).join(', ')}</span>` : '');
  const hist = [{ code: r.code, from: r.since, now: true }, ...(r.history || []).slice().reverse()];
  $('sHist').innerHTML = hist.map((h, i) => { const n = decodeSafe(h.code); return `<li><time>${h.from ? fmtDate(h.from) : ''}</time><code>${esc(n ? shownCode(h.code, n) : h.code)}</code>${h.now ? `<span class="badge" style="margin:0">${L.current}</span>` : `<button class="mini" data-h="${i}">${L.use}</button>`}</li>`; }).join('');
  $('sHist').querySelectorAll('[data-h]').forEach(btn => btn.onclick = () => showCode(hist[+btn.dataset.h].code));
  $('sSrc').textContent = r.seen ? L.source([r.source || 'demo', r.map ? mapName(r.map) : ''].filter(Boolean).join(' · '), fmtDate(r.seen)) : '';
  const d = $('sheet');
  if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); } else d.setAttribute('open', '');
}
let copyTimer;
$('sCopy').onclick = async () => {
  const L = t(), btn = $('sCopy');
  try { await navigator.clipboard.writeText($('sCode').textContent); btn.textContent = L.copied; btn.classList.add('done'); }
  catch { const r = document.createRange(); r.selectNodeContents($('sCode')); getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = L.selected; }
  clearTimeout(copyTimer); copyTimer = setTimeout(() => { btn.textContent = L.copy; btn.classList.remove('done'); }, 1800);
};
$('sClose').onclick = () => { const d = $('sheet'); d.close ? d.close() : d.removeAttribute('open'); };
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sClose').onclick(); });

/* ---------- interfaz ---------- */
function buildBg() {
  document.querySelectorAll('.bgChips').forEach(box => {
    box.innerHTML = '';
    MAPN.forEach((name, i) => {
      const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = name;
      b.setAttribute('aria-pressed', i === bgIdx);
      b.onclick = () => { bgIdx = i; store.set('bg', i); buildBg(); render(); if (current && $('sheet').open) showCode(current.code); };
      box.append(b);
    });
  });
}
function stats() {
  const fmt = n => n.toLocaleString(t().locale);
  $('stPros').textContent = ds.pros.loaded ? fmt(ds.pros.rows.length) : '–';
  const np = ds.players.loaded ? ds.pros.rows.length + ds.players.rows.length : null;
  $('stPlayers').textContent = np === null ? (ds.players.total ? fmt(ds.players.total) : '–') : fmt(np);
  $('nPros').textContent = ds.pros.loaded ? fmt(ds.pros.rows.length) : '';
  $('nPlayers').textContent = np === null ? '' : fmt(np);
  const up = [ds.pros.updated, ds.players.updated].filter(Boolean).sort().pop();
  $('stUpdated').textContent = up ? fmtDate(up) : '–';
}
function fillFilters() {
  const L = t(), teamSel = $('team'), keep = teamSel.value;
  const teams = [...new Set(ds.pros.rows.map(r => r.team).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  teamSel.innerHTML = `<option value="">${L.allTeams}</option>` + teams.map(x => `<option>${esc(x)}</option>`).join('');
  teamSel.value = teams.includes(keep) ? keep : '';
  const s = $('sort'), ks = s.value || '0';
  s.innerHTML = L.sort.map((x, i) => `<option value="${i}">${x}</option>`).join(''); s.value = ks;
  $('q').placeholder = L.q; $('pq').placeholder = L.pq;
}
function render() { stats(); if (tab === 'pros') listPros(); else listPlayers(); }
function setTab(name, push) {
  tab = name;
  $('tab_pros').setAttribute('aria-selected', name === 'pros'); $('tab_players').setAttribute('aria-selected', name === 'players');
  $('panel_pros').hidden = name !== 'pros'; $('panel_players').hidden = name !== 'players';
  if (push) { try { history.replaceState(null, '', name === 'players' ? '#jugadores' : location.pathname + location.search); } catch {} }
  render();
}
function applyLang() {
  const L = t();
  document.documentElement.lang = lang;
  document.title = (lang === 'es' ? 'Miras de CS2 de pros y jugadores' : 'CS2 crosshairs of pros and players') + ' · CSConfig';
  document.querySelectorAll('[data-i]').forEach(el => { const v = L[el.dataset.i]; if (typeof v === 'string') el.innerHTML = v; });
  $('about').innerHTML = L.about.map(([q, a]) => `<div><h3>${q}</h3><p>${a}</p></div>`).join('');
  $('lang_es').setAttribute('aria-pressed', lang === 'es'); $('lang_en').setAttribute('aria-pressed', lang === 'en');
  fillFilters(); render();
}
$('lang_es').onclick = () => { lang = 'es'; store.set('lang', 'es'); applyLang(); };
$('lang_en').onclick = () => { lang = 'en'; store.set('lang', 'en'); applyLang(); };
$('tab_pros').onclick = () => setTab('pros', true);
$('tab_players').onclick = () => setTab('players', true);
['q', 'team', 'sort'].forEach(id => $(id).addEventListener('input', listPros));
let pqTimer; $('pq').addEventListener('input', () => { clearTimeout(pqTimer); pqTimer = setTimeout(listPlayers, 120); });

/* ---------- datos ---------- */
function prep(json, pro) {
  return (json.players || []).map(p => ({ ...p, pro: pro || !!p.pro, n: decodeSafe(p.code) })).filter(r => r.n && r.name)
    .map(r => ({ ...r, changed: (r.history || []).length > 0 && r.since && daysAgo(r.since) < 14 }));
}
function get(url) { return fetch(url, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }); }
let playersPromise = null;
function loadPlayers() {
  if (playersPromise) return playersPromise;
  playersPromise = get('data/players.json')
    .then(j => { ds.players.rows = prep(j, false); ds.players.updated = j.updated; ds.players.loaded = true; })
    .catch(() => { ds.players.failed = true; })
    .finally(render);
  return playersPromise;
}
buildBg(); applyLang(); setTab(tab, false);
get('data/pros.json')
  .then(j => { ds.pros.rows = prep(j, true); ds.pros.updated = j.updated; ds.pros.loaded = true; })
  .catch(() => { ds.pros.failed = true; })
  .finally(() => { fillFilters(); render(); loadPlayers(); });
})();
</script>
