name: Actualizar miras

on:
  push:
    branches: [main]
    paths: ["pipeline/pros.json", "pipeline/manual.json", "pipeline/og/**", "site/data/pros.json"]   # lista de pros, correcciones o diseño de las imágenes
  release:
    types: [published]     # al publicar una release con demos adjuntas
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC
  workflow_dispatch:
    inputs:
      demo_url:
        description: "URL directa de una demo (opcional)"
        required: false
        default: ""
      label:
        description: "Etiqueta de la fuente, p. ej. 'Major 2026 · Final' (opcional)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write      # contestar en los envíos de salas de FACEIT que estaban en cola

concurrency:
  group: update-crosshairs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r pipeline/requirements.txt
          command -v 7z || sudo apt-get install -y p7zip-full

      - name: Procesar demos
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          FACEIT_DOWNLOADS_TOKEN: ${{ secrets.FACEIT_DOWNLOADS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DEMO_URL: ${{ inputs.demo_url }} ${{ inputs.label }}
        run: python pipeline/update.py --report "$RUNNER_TEMP/report.json"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/og/package-lock.json

      - name: Imágenes de vista previa (og:image)
        run: |
          npm ci --prefix pipeline/og --no-audit --no-fund
          node pipeline/og/og.mjs

      - name: Avisos en Discord (cambios de mira y pros nuevos)
        continue-on-error: true   # si Discord falla, los datos se guardan igual
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://csconfig.counterstrike2.workers.dev' }}
        run: |
          # si los datos llegaron en un push (demos procesadas desde el PC), comparar con lo de antes del push
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --quiet --depth=1 origin "$BEFORE" && export AVISOS_BASE="$BEFORE"
          fi
          node pipeline/og/avisos.mjs

      - name: Guardar cambios
        run: |
          git config user.name "csconfig-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data site/og pipeline/state.json pipeline/faceit_cola.txt
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar miras $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi

      - name: Contestar en los envíos de la cola de FACEIT
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/cola_respuestas.py
