name: Actualizar miras

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC
  workflow_dispatch:
    inputs:
      demo_url:
        description: "URL directa de una demo (opcional)"
        required: false
        default: ""
      label:
        description: "Etiqueta de la fuente, p. ej. 'Major 2026 · Final' (opcional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-crosshairs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r pipeline/requirements.txt
          command -v 7z || sudo apt-get install -y p7zip-full

      - name: Procesar demos
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          FACEIT_DOWNLOADS_TOKEN: ${{ secrets.FACEIT_DOWNLOADS_TOKEN }}
          DEMO_URL: ${{ inputs.demo_url }} ${{ inputs.label }}
        run: python pipeline/update.py

      - name: Guardar cambios
        run: |
          git config user.name "csconfig-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/crosshairs.json pipeline/state.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar miras $(date -u +%F)"
            git push
          fi
